# Bumps the patch version (scripts/bump_version.py) on every push to the default branch, then
# pushes that bump back as its own commit — the reliable, "can't forget" version of "every push
# gets a patch bump." A local git hook (see hooks/pre-push) can't do this correctly: by the time a
# pre-push hook runs, git has already computed which commits it's about to send, so a NEW commit
# made inside that hook wouldn't actually be included in the push in flight. Running server-side,
# after the push already landed, sidesteps that ordering problem entirely.
#
# Guarded against an infinite loop (this workflow's own bump-commit would otherwise trigger
# itself again) via the [skip version bump] marker it puts in its own commit message, checked
# below before doing anything.
name: Bump version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    if: "!contains(github.event.head_commit.message, '[skip version bump]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        run: python3 scripts/bump_version.py patch

      - name: Commit and push the bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION electron/package.json
          NEW_VERSION=$(cat VERSION)
          git commit -m "chore: bump version to ${NEW_VERSION} [skip version bump]"
          git push
